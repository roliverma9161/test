<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Code Generator</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      border: none;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .qr-box {
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fa;
      border-radius: 15px;
      margin-top: 20px;
      padding: 20px;
    }

    #qrcode img {
      margin: auto;
    }

    .btn {
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card p-4 mx-auto">

      <h2 class="text-center fw-bold mb-2">QR Code Generator</h2>
      <p class="text-center text-muted">
        Enter text or URL to generate QR code
      </p>

      <input
        type="text"
        id="textInput"
        class="form-control mb-3"
        placeholder="Enter text or website URL"
      >

      <button class="btn btn-primary w-100" onclick="generateQR()">
        Generate QR Code
      </button>

      <div class="qr-box">
        <div id="qrcode">
          <p class="text-muted text-center mb-0">
            Your QR code will appear here
          </p>
        </div>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-success w-50" onclick="downloadQR()">
          Download
        </button>

        <button class="btn btn-danger w-50" onclick="clearQR()">
          Clear
        </button>
      </div>

      <p id="message" class="text-center text-danger mt-3 mb-0"></p>

    </div>
  </div>

  <script>
    let qrCode;

    function generateQR() {
      const text = document.getElementById("textInput").value.trim();
      const qrBox = document.getElementById("qrcode");
      const message = document.getElementById("message");

      message.textContent = "";

      if (text === "") {
        message.textContent = "Please enter text or URL!";
        return;
      }

      qrBox.innerHTML = "";

      qrCode = new QRCode(qrBox, {
        text: text,
        width: 180,
        height: 180,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function downloadQR() {
      const qrImage = document.querySelector("#qrcode img");
      const message = document.getElementById("message");

      if (!qrImage) {
        message.textContent = "First generate a QR code!";
        return;
      }

      const link = document.createElement("a");
      link.href = qrImage.src;
      link.download = "my-qr-code.png";
      link.click();
    }

    function clearQR() {
      document.getElementById("textInput").value = "";

      document.getElementById("qrcode").innerHTML = `
        <p class="text-muted text-center mb-0">
          Your QR code will appear here
        </p>
      `;

      document.getElementById("message").textContent = "";
      qrCode = null;
    }
  </script>

</body>
</html>
