<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unique Mini Webpage</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background glowing shapes for visual effect -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- Main Card Webpage -->
    <main class="card">
        <span class="badge">✦ Creator Studio</span>
        <h1 class="title">Crafting Digital <br><span class="highlight">Magic</span></h1>
        <p class="description">
            A small space for big ideas. Build fast, design sleek, and stay ahead of the curve.
        </p>

        <!-- Stats Section -->
        <div class="stats">
            <div class="stat-item">
                <h3>99+</h3>
                <p>Projects</p>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <p>Creative</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <a href="#" class="btn btn-primary">Get Started</a>
            <a href="#" class="btn btn-secondary">Learn More</a>
        </div>
    </main>

</body>
</html>
