<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BrainBox | Smart Notes Manager</title>

  <style>
    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    :root {
      --primary: #6c63ff;
      --primary-dark: #554be8;

      --bg: #f5f6fb;
      --card: #ffffff;

      --text: #181a24;
      --muted: #777c90;

      --border: #e7e8ef;

      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;

      --shadow: 0 12px 35px rgba(30, 35, 70, 0.08);
    }

    body.dark {
      --bg: #0f1117;
      --card: #181b24;
      --text: #f5f7ff;
      --muted: #9da3b5;
      --border: #2a2e3b;

      --shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: 0.3s ease;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    /* =========================
       APP
    ========================= */

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 250px;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;

      background: var(--card);
      border-right: 1px solid var(--border);

      padding: 24px 16px;

      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;

      padding: 0 10px;

      margin-bottom: 42px;
    }

    .logo-icon {
      width: 43px;
      height: 43px;

      border-radius: 14px;

      display: grid;
      place-items: center;

      background: linear-gradient(
        135deg,
        var(--primary),
        #9a91ff
      );

      color: white;
      font-size: 21px;

      box-shadow:
        0 8px 20px rgba(108, 99, 255, 0.25);
    }

    .logo h2 {
      font-size: 21px;
    }

    .logo h2 span {
      color: var(--primary);
    }

    .menu-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;

      letter-spacing: 1px;

      padding: 0 11px;

      margin-bottom: 12px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .nav-btn {
      width: 100%;

      padding: 13px 14px;

      border-radius: 12px;

      background: transparent;

      color: var(--muted);

      text-align: left;

      font-weight: 600;

      transition: 0.25s;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(108, 99, 255, 0.1);
      color: var(--primary);
    }

    .sidebar-bottom {
      position: absolute;

      left: 16px;
      right: 16px;
      bottom: 22px;
    }

    .theme-btn {
      width: 100%;

      padding: 12px;

      border-radius: 12px;

      background: var(--bg);

      color: var(--text);

      text-align: left;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      margin-left: 250px;

      width: calc(100% - 250px);

      padding: 30px;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 28px;
    }

    .welcome h1 {
      font-size: 30px;

      margin-bottom: 6px;
    }

    .welcome p {
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-box {
      background: var(--card);

      border: 1px solid var(--border);

      padding: 11px 15px;

      border-radius: 11px;

      color: var(--muted);

      font-size: 13px;
    }

    .primary-btn {
      padding: 12px 18px;

      border-radius: 11px;

      color: white;

      font-weight: 700;

      background: linear-gradient(
        135deg,
        var(--primary),
        #9188ff
      );

      box-shadow:
        0 8px 20px rgba(108, 99, 255, 0.2);

      transition: 0.2s;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;

      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 20px;

      box-shadow: var(--shadow);
    }

    .stat-top {
      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .stat-card h3 {
      font-size: 27px;

      margin-bottom: 3px;
    }

    .stat-card p {
      color: var(--muted);

      font-size: 13px;
    }

    .stat-icon {
      width: 42px;
      height: 42px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      background: rgba(108, 99, 255, 0.1);

      color: var(--primary);

      font-size: 19px;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      background: var(--card);

      border: 1px solid var(--border);

      padding: 15px;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 25px;
    }

    .search-box {
      position: relative;

      flex: 1;
    }

    .search-box span {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);
    }

    .search-box input {
      width: 100%;

      padding: 12px 14px 12px 40px;

      border-radius: 10px;

      border: 1px solid var(--border);

      background: var(--bg);

      color: var(--text);

      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .filter-buttons {
      display: flex;

      gap: 6px;
    }

    .filter-btn {
      padding: 10px 14px;

      border-radius: 9px;

      background: transparent;

      color: var(--muted);
    }

    .filter-btn.active {
      background: var(--primary);

      color: white;
    }

    /* =========================
       SECTION
    ========================= */

    .section-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 17px;
    }

    .section-header h2 {
      font-size: 20px;
    }

    .section-header span {
      color: var(--muted);

      font-size: 13px;
    }

    /* =========================
       NOTES
    ========================= */

    .notes-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;
    }

    .note-card {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 19px;

      box-shadow: var(--shadow);

      transition: 0.25s;

      position: relative;
    }

    .note-card:hover {
      transform: translateY(-4px);
    }

    .note-card.pinned {
      border-color: rgba(108, 99, 255, 0.45);
    }

    .note-top {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 15px;
    }

    .note-category {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding: 6px 9px;

      border-radius: 20px;

      background: rgba(108, 99, 255, 0.1);

      color: var(--primary);

      font-size: 11px;

      font-weight: 700;
    }

    .note-actions {
      display: flex;

      gap: 5px;
    }

    .icon-btn {
      width: 31px;
      height: 31px;

      border-radius: 8px;

      background: var(--bg);

      color: var(--muted);

      transition: 0.2s;
    }

    .icon-btn:hover {
      color: var(--primary);
    }

    .note-card h3 {
      font-size: 18px;

      margin-bottom: 9px;
    }

    .note-content {
      color: var(--muted);

      font-size: 13px;

      line-height: 1.6;

      min-height: 62px;

      margin-bottom: 17px;

      display: -webkit-box;

      -webkit-line-clamp: 3;

      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .note-tags {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-bottom: 15px;
    }

    .tag {
      padding: 5px 8px;

      border-radius: 6px;

      background: var(--bg);

      color: var(--muted);

      font-size: 10px;
    }

    .note-footer {
      border-top: 1px solid var(--border);

      padding-top: 13px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .updated {
      color: var(--muted);

      font-size: 11px;
    }

    .pinned-label {
      color: var(--primary);

      font-size: 11px;

      font-weight: 700;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty-state {
      grid-column: 1 / -1;

      text-align: center;

      padding: 65px 20px;

      background: var(--card);

      border: 1px dashed var(--border);

      border-radius: 18px;
    }

    .empty-icon {
      font-size: 52px;

      margin-bottom: 14px;
    }

    .empty-state h3 {
      margin-bottom: 7px;
    }

    .empty-state p {
      color: var(--muted);

      margin-bottom: 20px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-overlay {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background: rgba(8, 10, 18, 0.68);

      backdrop-filter: blur(6px);

      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;

      max-width: 600px;

      max-height: 90vh;

      overflow-y: auto;

      background: var(--card);

      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.25);

      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;

        transform:
          translateY(20px)
          scale(0.97);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }

    .modal-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 22px;
    }

    .close-btn {
      width: 35px;
      height: 35px;

      border-radius: 9px;

      background: var(--bg);

      color: var(--muted);

      font-size: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 7px;
    }

    .form-control {
      width: 100%;

      padding: 12px 13px;

      border-radius: 10px;

      border: 1px solid var(--border);

      outline: none;

      background: var(--bg);

      color: var(--text);
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    textarea.form-control {
      min-height: 150px;

      resize: vertical;

      line-height: 1.6;
    }

    .form-row {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 13px;
    }

    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 22px;
    }

    .cancel-btn {
      padding: 12px 18px;

      border-radius: 10px;

      background: var(--bg);

      color: var(--text);
    }

    /* =========================
       VIEW NOTE MODAL
    ========================= */

    .view-title {
      font-size: 25px;

      margin-bottom: 12px;
    }

    .view-category {
      display: inline-block;

      padding: 6px 10px;

      border-radius: 20px;

      background: rgba(108, 99, 255, 0.1);

      color: var(--primary);

      font-size: 11px;

      font-weight: 700;

      margin-bottom: 20px;
    }

    .view-content {
      white-space: pre-wrap;

      color: var(--muted);

      line-height: 1.8;

      font-size: 14px;

      max-height: 400px;

      overflow-y: auto;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      right: 25px;

      bottom: 25px;

      background: var(--text);

      color: var(--card);

      padding: 14px 18px;

      border-radius: 12px;

      box-shadow: var(--shadow);

      transform: translateY(100px);

      opacity: 0;

      transition: 0.3s;

      z-index: 2000;
    }

    .toast.show {
      transform: translateY(0);

      opacity: 1;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {

      .stats {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .notes-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (max-width: 800px) {

      .sidebar {
        width: 74px;

        padding:
          20px 10px;
      }

      .logo {
        justify-content: center;

        padding: 0;
      }

      .logo h2,
      .menu-title,
      .nav-btn span,
      .theme-btn span {
        display: none;
      }

      .nav-btn {
        text-align: center;

        font-size: 20px;
      }

      .sidebar-bottom {
        left: 10px;

        right: 10px;
      }

      .main {
        margin-left: 74px;

        width:
          calc(100% - 74px);

        padding: 20px;
      }

      .toolbar {
        flex-direction: column;

        align-items: stretch;
      }

    }

    @media (max-width: 600px) {

      .topbar {
        flex-direction: column;

        align-items: flex-start;
      }

      .top-actions {
        width: 100%;
      }

      .date-box {
        flex: 1;
      }

      .stats {
        grid-template-columns:
          1fr 1fr;
      }

      .notes-grid {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 15px;
      }

    }

  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

      <div class="logo">

        <div class="logo-icon">
          🧠
        </div>

        <h2>
          Brain<span>Box</span>
        </h2>

      </div>


      <div class="menu-title">
        KNOWLEDGE
      </div>


      <nav class="nav">

        <button
          class="nav-btn active"
          onclick="setFilter('all')"
        >
          🏠 <span>All Notes</span>
        </button>

        <button
          class="nav-btn"
          onclick="setFilter('pinned')"
        >
          📌 <span>Pinned</span>
        </button>

        <button
          class="nav-btn"
          onclick="setFilter('favorite')"
        >
          ⭐ <span>Favorites</span>
        </button>

        <button
          class="nav-btn"
          onclick="setFilter('study')"
        >
          📚 <span>Study</span>
        </button>

        <button
          class="nav-btn"
          onclick="setFilter('coding')"
        >
          💻 <span>Coding</span>
        </button>

        <button
          class="nav-btn"
          onclick="setFilter('ideas')"
        >
          💡 <span>Ideas</span>
        </button>

      </nav>


      <div class="sidebar-bottom">

        <button
          class="theme-btn"
          onclick="toggleTheme()"
        >
          🌙 <span>Dark Mode</span>
        </button>

      </div>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

      <!-- TOPBAR -->

      <header class="topbar">

        <div class="welcome">

          <h1>
            Good Day! 👋
          </h1>

          <p>
            Capture your ideas. Organize your knowledge.
          </p>

        </div>


        <div class="top-actions">

          <div
            class="date-box"
            id="currentDate"
          >
            Today
          </div>

          <button
            class="primary-btn"
            onclick="openEditor()"
          >
            + New Note
          </button>

        </div>

      </header>


      <!-- =========================
           STATS
      ========================= -->

      <section class="stats">

        <div class="stat-card">

          <div class="stat-top">

            <div>

              <h3 id="totalNotes">
                0
              </h3>

              <p>
                Total Notes
              </p>

            </div>

            <div class="stat-icon">
              📝
            </div>

          </div>

        </div>


        <div class="stat-card">

          <div class="stat-top">

            <div>

              <h3 id="pinnedNotes">
                0
              </h3>

              <p>
                Pinned
              </p>

            </div>

            <div class="stat-icon">
              📌
            </div>

          </div>

        </div>


        <div class="stat-card">

          <div class="stat-top">

            <div>

              <h3 id="favoriteNotes">
                0
              </h3>

              <p>
                Favorites
              </p>

            </div>

            <div class="stat-icon">
              ⭐
            </div>

          </div>

        </div>


        <div class="stat-card">

          <div class="stat-top">

            <div>

              <h3 id="categoryCount">
                0
              </h3>

              <p>
                Categories
              </p>

            </div>

            <div class="stat-icon">
              🗂️
            </div>

          </div>

        </div>

      </section>


      <!-- =========================
           TOOLBAR
      ========================= -->

      <section class="toolbar">

        <div class="search-box">

          <span>
            🔍
          </span>

          <input
            type="text"
            id="searchInput"
            placeholder="Search notes, tags or content..."
            oninput="renderNotes()"
          />

        </div>


        <div class="filter-buttons">

          <button
            class="filter-btn active"
            id="filterAll"
            onclick="setFilter('all')"
          >
            All
          </button>

          <button
            class="filter-btn"
            id="filterPinned"
            onclick="setFilter('pinned')"
          >
            Pinned
          </button>

          <button
            class="filter-btn"
            id="filterFavorite"
            onclick="setFilter('favorite')"
          >
            Favorites
          </button>

        </div>

      </section>


      <!-- =========================
           NOTES
      ========================= -->

      <div class="section-header">

        <h2>
          My Knowledge
        </h2>

        <span id="noteCount">
          0 notes
        </span>

      </div>


      <section
        class="notes-grid"
        id="notesGrid"
      ></section>

    </main>

  </div>


  <!-- =========================
       EDITOR MODAL
  ========================= -->

  <div
    class="modal-overlay"
    id="editorOverlay"
  >

    <div class="modal">

      <div class="modal-header">

        <h2 id="editorTitle">
          Create New Note
        </h2>

        <button
          class="close-btn"
          onclick="closeEditor()"
        >
          ×
        </button>

      </div>


      <form id="noteForm">

        <div class="form-group">

          <label>
            Note Title
          </label>

          <input
            type="text"
            id="noteTitle"
            class="form-control"
            placeholder="e.g. Java OOP Concepts"
            required
          />

        </div>


        <div class="form-row">

          <div class="form-group">

            <label>
              Category
            </label>

            <select
              id="noteCategory"
              class="form-control"
            >

              <option value="study">
                📚 Study
              </option>

              <option value="coding">
                💻 Coding
              </option>

              <option value="ideas">
                💡 Ideas
              </option>

              <option value="personal">
                🌱 Personal
              </option>

              <option value="work">
                💼 Work
              </option>

              <option value="other">
                📁 Other
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>
              Tags
            </label>

            <input
              type="text"
              id="noteTags"
              class="form-control"
              placeholder="java, oop, backend"
            />

          </div>

        </div>


        <div class="form-group">

          <label>
            Note Content
          </label>

          <textarea
            id="noteContent"
            class="form-control"
            placeholder="Write your knowledge here..."
            required
          ></textarea>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            class="cancel-btn"
            onclick="closeEditor()"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="primary-btn"
          >
            Save Note
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =========================
       VIEW MODAL
  ========================= -->

  <div
    class="modal-overlay"
    id="viewOverlay"
  >

    <div class="modal">

      <div class="modal-header">

        <h2>
          Note Preview
        </h2>

        <button
          class="close-btn"
          onclick="closeView()"
        >
          ×
        </button>

      </div>


      <div id="viewNote">

      </div>

    </div>

  </div>


  <!-- =========================
       TOAST
  ========================= -->

  <div
    class="toast"
    id="toast"
  >
    Note saved successfully!
  </div>


  <script>

    /* =========================
       DATA
    ========================= */

    let notes =
      JSON.parse(
        localStorage.getItem("brainBoxNotes")
      ) || [];

    let currentFilter = "all";

    let editingId = null;


    /* =========================
       CATEGORY ICONS
    ========================= */

    const categoryIcons = {

      study: "📚",

      coding: "💻",

      ideas: "💡",

      personal: "🌱",

      work: "💼",

      other: "📁"

    };


    const categoryNames = {

      study: "Study",

      coding: "Coding",

      ideas: "Ideas",

      personal: "Personal",

      work: "Work",

      other: "Other"

    };


    /* =========================
       SAMPLE NOTES
    ========================= */

    if (notes.length === 0) {

      notes = [

        {
          id: Date.now(),
          title: "Java OOP Concepts",
          content:
            "Object Oriented Programming is based on classes and objects. The four major principles are Encapsulation, Inheritance, Polymorphism and Abstraction.",
          category: "study",
          tags: ["java", "oop", "programming"],
          pinned: true,
          favorite: true,
          updated: new Date().toISOString()
        },

        {
          id: Date.now() + 1,
          title: "React Hooks",
          content:
            "useState is used for state management and useEffect is used for side effects such as API calls, subscriptions and DOM related operations.",
          category: "coding",
          tags: ["react", "hooks", "frontend"],
          pinned: false,
          favorite: true,
          updated: new Date().toISOString()
        },

        {
          id: Date.now() + 2,
          title: "Project Ideas",
          content:
            "Build a developer dashboard, smart expense manager, AI study assistant and a full stack job tracking application.",
          category: "ideas",
          tags: ["projects", "ideas", "portfolio"],
          pinned: true,
          favorite: false,
          updated: new Date().toISOString()
        }

      ];

      saveNotes();

    }


    /* =========================
       SAVE
    ========================= */

    function saveNotes() {

      localStorage.setItem(
        "brainBoxNotes",
        JSON.stringify(notes)
      );

    }


    /* =========================
       RENDER
    ========================= */

    function renderNotes() {

      const grid =
        document.getElementById(
          "notesGrid"
        );


      const search =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .toLowerCase()
          .trim();


      let filtered =
        notes.filter(note => {

          const tagsText =
            note.tags.join(" ");


          const searchableText =
            `${note.title}
             ${note.content}
             ${tagsText}
             ${note.category}`
              .toLowerCase();


          const matchesSearch =
            searchableText.includes(
              search
            );


          if (
            currentFilter ===
            "pinned"
          ) {

            return (
              matchesSearch &&
              note.pinned
            );

          }


          if (
            currentFilter ===
            "favorite"
          ) {

            return (
              matchesSearch &&
              note.favorite
            );

          }


          if (
            [
              "study",
              "coding",
              "ideas"
            ].includes(
              currentFilter
            )
          ) {

            return (
              matchesSearch &&
              note.category ===
              currentFilter
            );

          }


          return matchesSearch;

        });


      document.getElementById(
        "noteCount"
      ).textContent =
        `${filtered.length} note${
          filtered.length !== 1
            ? "s"
            : ""
        }`;


      if (filtered.length === 0) {

        grid.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              🧠
            </div>

            <h3>
              No notes found
            </h3>

            <p>
              Start capturing your knowledge.
            </p>

            <button
              class="primary-btn"
              onclick="openEditor()"
            >
              + Create Note
            </button>

          </div>

        `;

        updateStats();

        return;

      }


      grid.innerHTML =
        filtered.map(
          note => {

            const tags =
              note.tags
                .map(
                  tag =>
                    `<span class="tag">
                      #${escapeHTML(tag)}
                    </span>`
                )
                .join("");


            return `

              <article
                class="note-card ${
                  note.pinned
                    ? "pinned"
                    : ""
                }"
              >

                <div class="note-top">

                  <span class="note-category">

                    ${
                      categoryIcons[
                        note.category
                      ] || "📁"
                    }

                    ${
                      categoryNames[
                        note.category
                      ] || "Other"
                    }

                  </span>


                  <div class="note-actions">

                    <button
                      class="icon-btn"
                      onclick="togglePin(${note.id})"
                      title="Pin"
                    >
                      ${
                        note.pinned
                          ? "📌"
                          : "📍"
                      }
                    </button>


                    <button
                      class="icon-btn"
                      onclick="toggleFavorite(${note.id})"
                      title="Favorite"
                    >
                      ${
                        note.favorite
                          ? "⭐"
                          : "☆"
                      }
                    </button>


                    <button
                      class="icon-btn"
                      onclick="viewNote(${note.id})"
                      title="View"
                    >
                      👁️
                    </button>


                    <button
                      class="icon-btn"
                      onclick="editNote(${note.id})"
                      title="Edit"
                    >
                      ✏️
                    </button>


                    <button
                      class="icon-btn"
                      onclick="deleteNote(${note.id})"
                      title="Delete"
                    >
                      🗑️
                    </button>

                  </div>

                </div>


                <h3>
                  ${escapeHTML(note.title)}
                </h3>


                <p class="note-content">
                  ${escapeHTML(note.content)}
                </p>


                <div class="note-tags">

                  ${tags}

                </div>


                <div class="note-footer">

                  <span class="updated">
                    Updated
                    ${formatDate(note.updated)}
                  </span>


                  ${
                    note.pinned
                      ? `
                        <span class="pinned-label">
                          📌 Pinned
                        </span>
                      `
                      : ""
                  }

                </div>

              </article>

            `;

          }
        ).join("");


      updateStats();

    }


    /* =========================
       STATS
    ========================= */

    function updateStats() {

      const total =
        notes.length;


      const pinned =
        notes.filter(
          note => note.pinned
        ).length;


      const favorite =
        notes.filter(
          note => note.favorite
        ).length;


      const categories =
        new Set(
          notes.map(
            note => note.category
          )
        ).size;


      document.getElementById(
        "totalNotes"
      ).textContent =
        total;


      document.getElementById(
        "pinnedNotes"
      ).textContent =
        pinned;


      document.getElementById(
        "favoriteNotes"
      ).textContent =
        favorite;


      document.getElementById(
        "categoryCount"
      ).textContent =
        categories;

    }


    /* =========================
       OPEN EDITOR
    ========================= */

    function openEditor(id = null) {

      editingId = id;


      const overlay =
        document.getElementById(
          "editorOverlay"
        );


      const title =
        document.getElementById(
          "editorTitle"
        );


      if (id) {

        const note =
          notes.find(
            item => item.id === id
          );


        if (!note) return;


        title.textContent =
          "Edit Note";


        document.getElementById(
          "noteTitle"
        ).value =
          note.title;


        document.getElementById(
          "noteContent"
        ).value =
          note.content;


        document.getElementById(
          "noteCategory"
        ).value =
          note.category;


        document.getElementById(
          "noteTags"
        ).value =
          note.tags.join(", ");

      } else {

        title.textContent =
          "Create New Note";


        document
          .getElementById(
            "noteForm"
          )
          .reset();

      }


      overlay.classList.add(
        "show"
      );

    }


    /* =========================
       CLOSE EDITOR
    ========================= */

    function closeEditor() {

      document
        .getElementById(
          "editorOverlay"
        )
        .classList.remove(
          "show"
        );


      editingId = null;

    }


    /* =========================
       FORM SUBMIT
    ========================= */

    document
      .getElementById(
        "noteForm"
      )
      .addEventListener(
        "submit",
        function (e) {

          e.preventDefault();


          const title =
            document
              .getElementById(
                "noteTitle"
              )
              .value
              .trim();


          const content =
            document
              .getElementById(
                "noteContent"
              )
              .value
              .trim();


          const category =
            document
              .getElementById(
                "noteCategory"
              )
              .value;


          const tagsInput =
            document
              .getElementById(
                "noteTags"
              )
              .value;


          const tags =
            tagsInput
              .split(",")
              .map(
                tag =>
                  tag.trim()
              )
              .filter(Boolean);


          if (editingId) {

            const note =
              notes.find(
                item =>
                  item.id ===
                  editingId
              );


            if (note) {

              note.title =
                title;

              note.content =
                content;

              note.category =
                category;

              note.tags =
                tags;

              note.updated =
                new Date().toISOString();

            }


            showToast(
              "Note updated successfully! ✨"
            );

          } else {

            const newNote = {

              id: Date.now(),

              title,

              content,

              category,

              tags,

              pinned: false,

              favorite: false,

              updated:
                new Date().toISOString()

            };


            notes.unshift(
              newNote
            );


            showToast(
              "New note created! 🧠"
            );

          }


          saveNotes();

          closeEditor();

          renderNotes();

        }
      );


    /* =========================
       EDIT NOTE
    ========================= */

    function editNote(id) {

      openEditor(id);

    }


    /* =========================
       DELETE NOTE
    ========================= */

    function deleteNote(id) {

      const note =
        notes.find(
          item => item.id === id
        );


      if (!note) return;


      const confirmDelete =
        confirm(
          `Delete "${note.title}"?`
        );


      if (!confirmDelete)
        return;


      notes =
        notes.filter(
          item => item.id !== id
        );


      saveNotes();

      renderNotes();


      showToast(
        "Note deleted."
      );

    }


    /* =========================
       PIN
    ========================= */

    function togglePin(id) {

      const note =
        notes.find(
          item => item.id === id
        );


      if (!note) return;


      note.pinned =
        !note.pinned;


      saveNotes();

      renderNotes();


      showToast(
        note.pinned
          ? "📌 Note pinned"
          : "Note unpinned"
      );

    }


    /* =========================
       FAVORITE
    ========================= */

    function toggleFavorite(id) {

      const note =
        notes.find(
          item => item.id === id
        );


      if (!note) return;


      note.favorite =
        !note.favorite;


      saveNotes();

      renderNotes();


      showToast(
        note.favorite
          ? "⭐ Added to favorites"
          : "Removed from favorites"
      );

    }


    /* =========================
       VIEW NOTE
    ========================= */

    function viewNote(id) {

      const note =
        notes.find(
          item => item.id === id
        );


      if (!note) return;


      document.getElementById(
        "viewNote"
      ).innerHTML = `

        <h1 class="view-title">
          ${escapeHTML(note.title)}
        </h1>


        <span class="view-category">

          ${
            categoryIcons[
              note.category
            ] || "📁"
          }

          ${
            categoryNames[
              note.category
            ] || "Other"
          }

        </span>


        <div class="note-tags">

          ${
            note.tags
              .map(
                tag =>
                  `<span class="tag">
                    #${escapeHTML(tag)}
                  </span>`
              )
              .join("")
          }

        </div>


        <div class="view-content">

          ${escapeHTML(note.content)}

        </div>

      `;


      document
        .getElementById(
          "viewOverlay"
        )
        .classList.add(
          "show"
        );

    }


    /* =========================
       CLOSE VIEW
    ========================= */

    function closeView() {

      document
        .getElementById(
          "viewOverlay"
        )
        .classList.remove(
          "show"
        );

    }


    /* =========================
       FILTER
    ========================= */

    function setFilter(filter) {

      currentFilter =
        filter;


      document
        .querySelectorAll(
          ".filter-btn"
        )
        .forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );


      document
        .querySelectorAll(
          ".nav-btn"
        )
        .forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );


      if (filter === "all") {

        document
          .getElementById(
            "filterAll"
          )
          .classList.add(
            "active"
          );

        document
          .querySelectorAll(
            ".nav-btn"
          )[0]
          .classList.add(
            "active"
          );

      }


      if (filter === "pinned") {

        document
          .getElementById(
            "filterPinned"
          )
          .classList.add(
            "active"
          );

        document
          .querySelectorAll(
            ".nav-btn"
          )[1]
          .classList.add(
            "active"
          );

      }


      if (filter === "favorite") {

        document
          .getElementById(
            "filterFavorite"
          )
          .classList.add(
            "active"
          );

        document
          .querySelectorAll(
            ".nav-btn"
          )[2]
          .classList.add(
            "active"
          );

      }


      renderNotes();

    }


    /* =========================
       THEME
    ========================= */

    function toggleTheme() {

      document
        .body
        .classList
        .toggle(
          "dark"
        );


      const isDark =
        document.body
          .classList
          .contains("dark");


      localStorage.setItem(
        "brainBoxTheme",
        isDark
          ? "dark"
          : "light"
      );

    }


    /* =========================
       LOAD THEME
    ========================= */

    if (
      localStorage.getItem(
        "brainBoxTheme"
      ) === "dark"
    ) {

      document.body
        .classList
        .add("dark");

    }


    /* =========================
       DATE
    ========================= */

    function updateDate() {

      const date =
        new Date();


      document.getElementById(
        "currentDate"
      ).textContent =
        date.toLocaleDateString(
          "en-IN",
          {
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric"
          }
        );

    }


    /* =========================
       FORMAT DATE
    ========================= */

    function formatDate(dateString) {

      const date =
        new Date(
          dateString
        );


      return date.toLocaleDateString(
        "en-IN",
        {
          day: "numeric",
          month: "short",
          year: "numeric"
        }
      );

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(text) {

      return String(text)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================
       TOAST
    ========================= */

    function showToast(message) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      setTimeout(
        () => {

          toast.classList.remove(
            "show"
          );

        },
        2500
      );

    }


    /* =========================
       CLOSE MODALS OUTSIDE
    ========================= */

    document
      .getElementById(
        "editorOverlay"
      )
      .addEventListener(
        "click",
        function (e) {

          if (
            e.target === this
          ) {

            closeEditor();

          }

        }
      );


    document
      .getElementById(
        "viewOverlay"
      )
      .addEventListener(
        "click",
        function (e) {

          if (
            e.target === this
          ) {

            closeView();

          }

        }
      );


    /* =========================
       ESC KEY
    ========================= */

    document.addEventListener(
      "keydown",
      function (e) {

        if (
          e.key === "Escape"
        ) {

          closeEditor();

          closeView();

        }

      }
    );


    /* =========================
       INITIALIZE
    ========================= */

    updateDate();

    renderNotes();

  </script>

</body>
</html>
