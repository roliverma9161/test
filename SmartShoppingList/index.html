<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Shopping List</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #d4fc79, #96e6a1);
      font-family: Arial, sans-serif;
    }

    .card {
      border: none;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .item {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .purchased {
      text-decoration: line-through;
      color: gray;
      opacity: 0.7;
    }

    .btn {
      border-radius: 10px;
    }

    .total-box {
      background: #198754;
      color: white;
      border-radius: 15px;
      padding: 18px;
    }
  </style>
</head>

<body>

  <div class="container py-5">
    <div class="card p-4 mx-auto" style="max-width: 650px;">

      <h2 class="text-center fw-bold">🛒 Smart Shopping List</h2>

      <p class="text-center text-muted">
        Manage your shopping items easily
      </p>

      <div class="row g-2 mb-3">
        <div class="col-md-5">
          <input
            type="text"
            id="itemName"
            class="form-control"
            placeholder="Item name"
          >
        </div>

        <div class="col-md-3">
          <input
            type="number"
            id="quantity"
            class="form-control"
            placeholder="Quantity"
            min="1"
            value="1"
          >
        </div>

        <div class="col-md-4">
          <input
            type="number"
            id="price"
            class="form-control"
            placeholder="Price ₹"
            min="0"
          >
        </div>
      </div>

      <button
        class="btn btn-primary w-100 mb-3"
        onclick="addItem()"
      >
        Add Shopping Item
      </button>

      <input
        type="text"
        id="search"
        class="form-control mb-3"
        placeholder="Search items..."
        oninput="displayItems()"
      >

      <div class="total-box text-center mb-3">
        <h5 class="mb-1">Estimated Total</h5>
        <h2 class="fw-bold mb-0">₹<span id="total">0</span></h2>
      </div>

      <div class="d-flex justify-content-between mb-3">
        <span>
          Total Items:
          <strong id="itemCount">0</strong>
        </span>

        <span>
          Purchased:
          <strong id="purchasedCount">0</strong>
        </span>
      </div>

      <div id="list"></div>

      <button
        class="btn btn-danger w-100 mt-3"
        onclick="clearAll()"
      >
        Clear All Items
      </button>

      <p id="message" class="text-center text-muted mt-3 mb-0"></p>

    </div>
  </div>

  <script>
    let items = JSON.parse(localStorage.getItem("shoppingItems")) || [];

    function saveItems() {
      localStorage.setItem("shoppingItems", JSON.stringify(items));
    }

    function addItem() {
      const name = document.getElementById("itemName").value.trim();
      const quantity = Number(document.getElementById("quantity").value);
      const price = Number(document.getElementById("price").value);
      const message = document.getElementById("message");

      if (name === "") {
        message.textContent = "Please enter item name!";
        return;
      }

      if (quantity < 1 || price < 0 || isNaN(quantity) || isNaN(price)) {
        message.textContent = "Please enter valid quantity and price!";
        return;
      }

      const item = {
        id: Date.now(),
        name: name,
        quantity: quantity,
        price: price,
        purchased: false
      };

      items.push(item);
      saveItems();
      displayItems();

      document.getElementById("itemName").value = "";
      document.getElementById("quantity").value = 1;
      document.getElementById("price").value = "";

      message.textContent = "Item added successfully!";
    }

    function displayItems() {
      const list = document.getElementById("list");
      const searchText = document
        .getElementById("search")
        .value
        .toLowerCase();

      list.innerHTML = "";

      const filteredItems = items.filter(item =>
        item.name.toLowerCase().includes(searchText)
      );

      filteredItems.forEach(item => {
        const div = document.createElement("div");
        div.className = "item d-flex align-items-center justify-content-between gap-2";

        div.innerHTML = `
          <div class="form-check flex-grow-1">
            <input
              class="form-check-input"
              type="checkbox"
              ${item.purchased ? "checked" : ""}
              onchange="togglePurchased(${item.id})"
            >

            <label class="${item.purchased ? "purchased" : ""}">
              <strong>${escapeHTML(item.name)}</strong><br>
              <small>
                Quantity: ${item.quantity} |
                Price: ₹${item.price} |
                Total: ₹${item.quantity * item.price}
              </small>
            </label>
          </div>

          <button
            class="btn btn-sm btn-outline-danger"
            onclick="deleteItem(${item.id})"
          >
            Delete
          </button>
        `;

        list.appendChild(div);
      });

      updateSummary();
    }

    function togglePurchased(id) {
      items = items.map(item => {
        if (item.id === id) {
          item.purchased = !item.purchased;
        }

        return item;
      });

      saveItems();
      displayItems();
    }

    function deleteItem(id) {
      items = items.filter(item => item.id !== id);
      saveItems();
      displayItems();
    }

    function updateSummary() {
      const total = items.reduce(
        (sum, item) => sum + item.quantity * item.price,
        0
      );

      const purchased = items.filter(item => item.purchased).length;

      document.getElementById("total").textContent = total;
      document.getElementById("itemCount").textContent = items.length;
      document.getElementById("purchasedCount").textContent = purchased;
    }

    function clearAll() {
      if (items.length === 0) {
        document.getElementById("message").textContent =
          "Shopping list is already empty!";
        return;
      }

      items = [];
      saveItems();
      displayItems();

      document.getElementById("message").textContent =
        "All items cleared!";
    }

    function escapeHTML(text) {
      return text.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    displayItems();
  </script>

</body>
</html>
