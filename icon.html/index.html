<title>Professional Windows Folder Icons</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Segoe UI,Arial,sans-serif;
    background:
        radial-gradient(circle at top,#162b50 0%,#071225 45%,#030812 100%);
    color:white;
    padding:40px 25px;
}

.container{
    max-width:1250px;
    margin:auto;
}

header{
    text-align:center;
    margin-bottom:45px;
}

header h1{
    font-size:36px;
    letter-spacing:1px;
    margin-bottom:10px;
}

header p{
    color:#91a0b8;
    font-size:16px;
}

.icons-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(210px,1fr));
    gap:25px;
}

.card{
    position:relative;
    padding:25px 15px 20px;
    border-radius:22px;

    background:rgba(15,28,53,.75);

    border:1px solid rgba(120,160,220,.18);

    box-shadow:
        0 20px 50px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.06);

    backdrop-filter:blur(15px);

    transition:.35s ease;
}

.card:hover{
    transform:translateY(-8px);

    border-color:rgba(255,255,255,.25);

    box-shadow:
        0 25px 60px rgba(0,0,0,.5);
}

.icon-wrapper{
    width:180px;
    height:180px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;
}

.icon-wrapper svg{
    width:170px;
    height:170px;

    overflow:visible;

    transition:.35s ease;
}

.card:hover svg{
    transform:scale(1.06);
}

.title{
    text-align:center;
    margin-top:10px;

    font-size:16px;
    font-weight:700;

    letter-spacing:.5px;
}

.buttons{
    display:flex;
    gap:8px;
    justify-content:center;

    margin-top:16px;
}

button{
    border:none;
    padding:9px 12px;

    border-radius:9px;

    cursor:pointer;

    background:#eaf2ff;
    color:#071225;

    font-weight:600;

    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    background:white;
}

.download-all{
    display:block;
    margin:40px auto 0;

    padding:13px 25px;

    background:linear-gradient(
        135deg,
        #1da1ff,
        #7c4dff
    );

    color:white;

    font-size:15px;
}

.download-all:hover{
    background:linear-gradient(
        135deg,
        #38b5ff,
        #936fff
    );
}

.note{
    margin-top:30px;
    text-align:center;

    color:#71819b;
    font-size:13px;
}

</style>
</head>

<script>


// ======================================
// DOWNLOAD SVG
// ======================================

function downloadSVG(id,name){

    const svg =
        document.getElementById(id);

    const serializer =
        new XMLSerializer();

    let source =
        serializer.serializeToString(svg);


    if(!source.includes("xmlns=")){

        source =
        source.replace(
            "<svg",
            '<svg xmlns="http://www.w3.org/2000/svg"'
        );

    }


    const blob =
        new Blob(
            [source],
            {
                type:"image/svg+xml"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    link.download =
        name + ".svg";


    link.click();


    URL.revokeObjectURL(url);

}



// ======================================
// SVG → PNG 256×256
// ======================================

function downloadPNG(id,name){

    const svg =
        document.getElementById(id);


    const serializer =
        new XMLSerializer();


    let source =
        serializer.serializeToString(svg);


    if(!source.includes("xmlns=")){

        source =
        source.replace(
            "<svg",
            '<svg xmlns="http://www.w3.org/2000/svg"'
        );

    }


    const svgBlob =
        new Blob(
            [source],
            {
                type:"image/svg+xml"
            }
        );


    const url =
        URL.createObjectURL(svgBlob);


    const img =
        new Image();


    img.onload = function(){

        const canvas =
            document.createElement("canvas");


        // EXACT 256 × 256

        canvas.width = 256;
        canvas.height = 256;


        const ctx =
            canvas.getContext("2d");


        ctx.clearRect(
            0,
            0,
            256,
            256
        );


        ctx.drawImage(
            img,
            0,
            0,
            256,
            256
        );


        canvas.toBlob(
            function(blob){

                const pngURL =
                    URL.createObjectURL(blob);


                const link =
                    document.createElement("a");


                link.href =
                    pngURL;


                link.download =
                    name + "_256x256.png";


                link.click();


                URL.revokeObjectURL(pngURL);

            },
            "image/png"
        );


        URL.revokeObjectURL(url);

    };


    img.src = url;

}



// ======================================
// DOWNLOAD ALL
// ======================================

function downloadAll(){

    const icons = [

        ["development","01_DEVELOPMENT"],
        ["college","02_COLLEGE"],
        ["projects","03_PROJECTS"],
        ["resources","04_RESOURCES"],
        ["personal","05_PERSONAL"]

    ];


    icons.forEach(
        function(icon,index){

            setTimeout(
                function(){

                    downloadPNG(
                        icon[0],
                        icon[1]
                    );

                },
                index * 700
            );

        }
    );

}

</script>
