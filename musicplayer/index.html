<!DOCTYPE html>
<html>
<head>
<title>Music Player</title>
<style>
body{background:#121212;color:white;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.player{background:#1e1e1e;width:320px;padding:30px;border-radius:25px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.5)}
img{width:200px;height:200px;border-radius:50%;object-fit:cover;animation: rotate 6s linear infinite; animation-play-state: paused;}
.playing img{animation-play-state: running;}
@keyframes rotate{to{transform:rotate(360deg)}}
h2{margin:15px 0 5px} p{color:#aaa;margin:0}
.controls{margin-top:25px;display:flex;justify-content:space-around;align-items:center}
.controls button{background:#6c63ff;border:none;color:white;width:50px;height:50px;border-radius:50%;font-size:20px;cursor:pointer}
input{width:100%;margin-top:20px;accent-color:#6c63ff}
</style>
</head>
<body>
<div class="player" id="player">
<img src="https://picsum.photos/200/200?random=5">
<h2>Tum Hi Ho</h2>
<p>Arijit Singh</p>
<input type="range" id="progress" value="30">
<div class="controls">
<button>⏮</button>
<button id="playBtn" onclick="playPause()">▶</button>
<button>⏭</button>
</div>
</div>
<script>
let isPlaying=false;
function playPause(){
  isPlaying=!isPlaying;
  document.getElementById("playBtn").innerText=isPlaying?"⏸":"▶";
  document.getElementById("player").classList.toggle("playing", isPlaying);
}
</script>
</body>
</html>
