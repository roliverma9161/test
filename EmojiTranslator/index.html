<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emoji Translator</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 550px;
      border: none;
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    textarea {
      resize: none;
      border-radius: 15px !important;
    }

    .result-box {
      min-height: 120px;
      padding: 20px;
      background: #fff8e7;
      border-radius: 15px;
      font-size: 25px;
      word-wrap: break-word;
    }

    .btn {
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card p-4 mx-auto">

      <h2 class="text-center fw-bold">😎 Emoji Translator</h2>

      <p class="text-center text-muted">
        Type your sentence and convert it into emojis
      </p>

      <textarea
        id="textInput"
        class="form-control mb-3"
        rows="4"
        placeholder="Example: I love coding"
        oninput="translateText()"
      ></textarea>

      <div class="result-box mb-3" id="result">
        Your emoji translation will appear here...
      </div>

      <div class="d-flex gap-2">
        <button
          class="btn btn-success w-50"
          onclick="copyResult()"
        >
          Copy
        </button>

        <button
          class="btn btn-danger w-50"
          onclick="clearText()"
        >
          Clear
        </button>
      </div>

      <p id="message" class="text-center text-muted mt-3 mb-0"></p>

    </div>
  </div>

  <script>
    const emojiMap = {
      love: "❤️",
      coding: "💻",
      code: "👨‍💻",
      happy: "😊",
      sad: "😢",
      angry: "😡",
      cool: "😎",
      fire: "🔥",
      good: "👍",
      bad: "👎",
      amazing: "🤩",
      beautiful: "😍",
      food: "🍔",
      pizza: "🍕",
      coffee: "☕",
      tea: "🍵",
      water: "💧",
      apple: "🍎",
      banana: "🍌",
      dog: "🐶",
      cat: "🐱",
      lion: "🦁",
      school: "🏫",
      college: "🎓",
      book: "📖",
      study: "📚",
      exam: "📝",
      home: "🏠",
      car: "🚗",
      bike: "🏍️",
      phone: "📱",
      computer: "💻",
      money: "💰",
      gift: "🎁",
      birthday: "🎂",
      party: "🎉",
      music: "🎵",
      movie: "🎬",
      sun: "☀️",
      moon: "🌙",
      star: "⭐",
      rain: "🌧️",
      hello: "👋",
      bye: "👋",
      thanks: "🙏",
      sorry: "😔",
      yes: "✅",
      no: "❌",
      laugh: "😂",
      sleep: "😴",
      time: "⏰",
      work: "💼",
      success: "🏆",
      India: "🇮🇳"
    };

    function translateText() {
      const input = document.getElementById("textInput").value;
      const result = document.getElementById("result");

      if (input.trim() === "") {
        result.textContent = "Your emoji translation will appear here...";
        return;
      }

      const words = input.split(" ");

      const translated = words.map(word => {
        const cleanWord = word
          .toLowerCase()
          .replace(/[.,!?]/g, "");

        return emojiMap[cleanWord] || word;
      });

      result.textContent = translated.join(" ");
    }

    function copyResult() {
      const result = document.getElementById("result").textContent;
      const message = document.getElementById("message");

      if (
        result === "Your emoji translation will appear here..."
      ) {
        message.textContent = "First enter some text!";
        return;
      }

      navigator.clipboard.writeText(result);
      message.textContent = "Emoji translation copied!";
    }

    function clearText() {
      document.getElementById("textInput").value = "";

      document.getElementById("result").textContent =
        "Your emoji translation will appear here...";

      document.getElementById("message").textContent = "";
    }
  </script>

</body>
</html>
