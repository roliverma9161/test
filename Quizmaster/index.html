
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QuizMaster - Quiz App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #09090f, #1b1235);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-box {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      color: #a78bfa;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #302746;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    #progress {
      width: 20%;
      height: 100%;
      background: #8b5cf6;
      transition: width 0.3s ease;
    }

    #question {
      font-size: 23px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .option {
      display: block;
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #403655;
      border-radius: 12px;
      background: #211b32;
      color: white;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: 0.3s;
    }

    .option:hover {
      border-color: #a78bfa;
      background: #302348;
    }

    .option.selected {
      background: #5b21b6;
      border-color: #c4b5fd;
    }

    .option.correct {
      background: #166534;
      border-color: #4ade80;
    }

    .option.wrong {
      background: #991b1b;
      border-color: #f87171;
    }

    .option:disabled {
      cursor: default;
      opacity: 1;
    }

    button.main-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }

    button.main-btn:hover:not(:disabled) {
      background: #7c3aed;
    }

    button.main-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    #result {
      text-align: center;
    }

    #result h2 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    #score-text {
      font-size: 22px;
      color: #c4b5fd;
      margin-bottom: 10px;
    }

    #message {
      color: #aaa;
      margin-bottom: 20px;
    }

    .score-circle {
      width: 120px;
      height: 120px;
      border: 5px solid #8b5cf6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 25px auto;
      font-size: 30px;
      font-weight: bold;
      color: #c4b5fd;
    }

    .timer {
      text-align: right;
      color: #fbbf24;
      margin-bottom: 15px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .quiz-box {
        padding: 22px;
      }

      h1 {
        font-size: 28px;
      }

      #question {
        font-size: 19px;
      }

      .option {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="quiz-box">

    <!-- QUIZ HEADER -->

    <h1>🧠 QuizMaster</h1>

    <p class="subtitle">
      Test Your Knowledge
    </p>

    <!-- QUIZ SECTION -->

    <div id="quiz-section">

      <div class="progress-info">
        <span id="question-number">Question 1 of 5</span>
        <span id="progress-percent">20%</span>
      </div>

      <div class="progress-bar">
        <div id="progress"></div>
      </div>

      <div class="timer">
        ⏱️ Time: <span id="time">30</span>s
      </div>

      <h2 id="question">
        Loading Question...
      </h2>

      <div id="options"></div>

      <button
        id="next-btn"
        class="main-btn"
        disabled
      >
        Next Question →
      </button>

    </div>

    <!-- RESULT SECTION -->

    <div id="result" class="hidden">

      <h2>🎉 Quiz Completed!</h2>

      <div class="score-circle">
        <span id="percentage">0%</span>
      </div>

      <p id="score-text"></p>

      <p id="message"></p>

      <button
        id="restart-btn"
        class="main-btn"
      >
        🔄 Restart Quiz
      </button>

    </div>

  </div>

  <script>

    // QUESTIONS DATA

    const questions = [
      {
        question: "Which language is used to build web pages?",
        options: ["Python", "HTML", "Java", "C++"],
        answer: "HTML"
      },

      {
        question: "Which language is used for webpage styling?",
        options: ["CSS", "Java", "SQL", "Python"],
        answer: "CSS"
      },

      {
        question: "Which language makes websites interactive?",
        options: ["HTML", "CSS", "JavaScript", "PHP"],
        answer: "JavaScript"
      },

      {
        question: "Which keyword declares a constant in JavaScript?",
        options: ["var", "let", "const", "static"],
        answer: "const"
      },

      {
        question: "Which method selects an HTML element by ID?",
        options: [
          "getElementById()",
          "queryClass()",
          "selectId()",
          "getElement()"
        ],
        answer: "getElementById()"
      }
    ];

    // VARIABLES

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = "";
    let timeLeft = 30;
    let timer;

    // ELEMENTS

    const questionElement =
      document.getElementById("question");

    const optionsElement =
      document.getElementById("options");

    const nextButton =
      document.getElementById("next-btn");

    const questionNumber =
      document.getElementById("question-number");

    const progressPercent =
      document.getElementById("progress-percent");

    const progress =
      document.getElementById("progress");

    const timeElement =
      document.getElementById("time");

    const quizSection =
      document.getElementById("quiz-section");

    const result =
      document.getElementById("result");

    const scoreText =
      document.getElementById("score-text");

    const percentageElement =
      document.getElementById("percentage");

    const messageElement =
      document.getElementById("message");

    const restartButton =
      document.getElementById("restart-btn");

    // LOAD QUESTION

    function loadQuestion() {

      clearInterval(timer);

      const question = questions[currentQuestion];

      questionElement.textContent =
        question.question;

      questionNumber.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

      const percent =
        Math.round(
          ((currentQuestion + 1) / questions.length) * 100
        );

      progressPercent.textContent =
        `${percent}%`;

      progress.style.width =
        `${percent}%`;

      optionsElement.innerHTML = "";

      selectedAnswer = "";

      nextButton.disabled = true;

      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "Finish Quiz 🎯"
          : "Next Question →";

      timeLeft = 30;

      timeElement.textContent = timeLeft;

      // CREATE OPTIONS

      question.options.forEach((option, index) => {

        const button =
          document.createElement("button");

        button.textContent =
          `${String.fromCharCode(65 + index)}. ${option}`;

        button.classList.add("option");

        button.addEventListener("click", () => {

          selectedAnswer = option;

          document.querySelectorAll(".option").forEach(btn => {
            btn.classList.remove("selected");
          });

          button.classList.add("selected");

          nextButton.disabled = false;

        });

        optionsElement.appendChild(button);

      });

      // START TIMER

      timer = setInterval(() => {

        timeLeft--;

        timeElement.textContent = timeLeft;

        if (timeLeft <= 0) {

          clearInterval(timer);

          nextButton.disabled = false;

          nextQuestion();

        }

      }, 1000);

    }

    // NEXT QUESTION

    function nextQuestion() {

      clearInterval(timer);

      const question = questions[currentQuestion];

      if (selectedAnswer === question.answer) {
        score++;
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {

        loadQuestion();

      } else {

        showResult();

      }

    }

    nextButton.addEventListener("click", nextQuestion);

    // SHOW RESULT

    function showResult() {

      quizSection.classList.add("hidden");

      result.classList.remove("hidden");

      const percentage =
        Math.round((score / questions.length) * 100);

      percentageElement.textContent =
        `${percentage}%`;

      scoreText.textContent =
        `You scored ${score} out of ${questions.length}!`;

      if (percentage >= 80) {

        messageElement.textContent =
          "Excellent! You are a Quiz Champion 🏆";

      } else if (percentage >= 50) {

        messageElement.textContent =
          "Good job! Keep learning and improving 💪";

      } else {

        messageElement.textContent =
          "Keep practicing! You can do better 🚀";

      }

    }

    // RESTART QUIZ

    restartButton.addEventListener("click", () => {

      clearInterval(timer);

      currentQuestion = 0;

      score = 0;

      selectedAnswer = "";

      quizSection.classList.remove("hidden");

      result.classList.add("hidden");

      loadQuestion();

    });

    // START QUIZ

    loadQuestion();

  </script>

</body>
</html>
