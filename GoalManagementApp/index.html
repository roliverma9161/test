<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GoalTrack | Achieve Your Goals</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    :root {
      --primary: #6c63ff;
      --primary-dark: #554be8;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #171923;
      --muted: #74798c;
      --border: #e8eaf0;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --shadow: 0 12px 35px rgba(30, 35, 70, 0.08);
    }

    body.dark {
      --bg: #0f1117;
      --card: #181b24;
      --text: #f5f7ff;
      --muted: #9da3b5;
      --border: #292e3b;
      --shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: 0.3s;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    /* =========================
       APP LAYOUT
    ========================= */

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 245px;
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 25px 16px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--primary), #9b8cff);
      display: grid;
      place-items: center;
      color: white;
      font-size: 21px;
      box-shadow: 0 8px 20px rgba(108, 99, 255, 0.25);
    }

    .logo h2 {
      font-size: 21px;
    }

    .logo span {
      color: var(--primary);
    }

    .menu-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 0 12px;
      margin-bottom: 12px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .nav button {
      width: 100%;
      text-align: left;
      padding: 13px 14px;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      transition: 0.25s;
      font-weight: 600;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(108, 99, 255, 0.1);
      color: var(--primary);
    }

    .sidebar-bottom {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 25px;
    }

    .theme-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      margin-left: 245px;
      width: calc(100% - 245px);
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .welcome h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .date-box {
      padding: 11px 15px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .primary-btn {
      background: linear-gradient(
        135deg,
        var(--primary),
        #8b82ff
      );
      color: white;
      padding: 12px 18px;
      border-radius: 11px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(108, 99, 255, 0.2);
      transition: 0.2s;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 21px;
      box-shadow: var(--shadow);
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(108, 99, 255, 0.1);
      color: var(--primary);
      font-size: 19px;
    }

    .stat-card h3 {
      font-size: 27px;
      margin-bottom: 3px;
    }

    .stat-card p {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       TOOLBAR
    ========================= */

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
    }

    .search {
      position: relative;
      flex: 1;
    }

    .search span {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
    }

    .search input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      outline: none;
      background: var(--bg);
      color: var(--text);
    }

    .filters {
      display: flex;
      gap: 7px;
    }

    .filter-btn {
      padding: 10px 14px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
    }

    /* =========================
       GOAL GRID
    ========================= */

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px;
    }

    .section-title h2 {
      font-size: 20px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .goal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .goal-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: var(--shadow);
      transition: 0.25s;
    }

    .goal-card:hover {
      transform: translateY(-4px);
    }

    .goal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 17px;
    }

    .category-icon {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: rgba(108, 99, 255, 0.1);
      font-size: 21px;
    }

    .goal-menu {
      display: flex;
      gap: 5px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
    }

    .icon-btn:hover {
      color: var(--primary);
    }

    .goal-card h3 {
      font-size: 18px;
      margin-bottom: 7px;
    }

    .goal-card .description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      min-height: 39px;
      margin-bottom: 17px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .progress-info span:last-child {
      color: var(--primary);
      font-weight: 700;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--bg);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(
        90deg,
        var(--primary),
        #9d95ff
      );
      border-radius: inherit;
      transition: width 0.4s;
    }

    .goal-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .deadline {
      color: var(--muted);
      font-size: 12px;
    }

    .deadline strong {
      color: var(--text);
      display: block;
      margin-top: 3px;
    }

    .progress-actions {
      display: flex;
      gap: 5px;
    }

    .small-btn {
      width: 31px;
      height: 31px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-weight: bold;
    }

    .small-btn:hover {
      background: var(--primary);
      color: white;
    }

    .completed {
      border-color: rgba(16, 185, 129, 0.4);
    }

    .completed .progress-fill {
      background: var(--success);
    }

    .completed-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 18px;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .empty h3 {
      margin-bottom: 7px;
    }

    .empty p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 20, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 550px;
      background: var(--card);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.25);
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .close-btn {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      background: var(--bg);
      color: var(--muted);
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-control {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 10px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    textarea.form-control {
      min-height: 90px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .range-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .range-wrapper input {
      flex: 1;
    }

    .range-value {
      min-width: 42px;
      font-weight: 700;
      color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    .cancel-btn {
      padding: 12px 18px;
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      right: 25px;
      bottom: 25px;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--text);
      color: var(--card);
      box-shadow: var(--shadow);
      transform: translateY(100px);
      opacity: 0;
      transition: 0.3s;
      z-index: 2000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1100px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .goal-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 75px;
        padding: 20px 10px;
      }

      .logo {
        justify-content: center;
        padding: 0;
      }

      .logo h2,
      .menu-title,
      .nav button span,
      .theme-btn span {
        display: none;
      }

      .nav button {
        text-align: center;
        font-size: 20px;
      }

      .sidebar-bottom {
        left: 10px;
        right: 10px;
      }

      .main {
        margin-left: 75px;
        width: calc(100% - 75px);
        padding: 20px;
      }

      .goal-grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-direction: column;
      }

      .filters {
        overflow-x: auto;
      }
    }

    @media (max-width: 550px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .top-actions {
        width: 100%;
      }

      .date-box {
        flex: 1;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat-card h3 {
        font-size: 22px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

      <div class="logo">
        <div class="logo-icon">🎯</div>

        <h2>Goal<span>Track</span></h2>
      </div>

      <div class="menu-title">
        MENU
      </div>

      <nav class="nav">

        <button class="active">
          🏠 <span>Dashboard</span>
        </button>

        <button onclick="setFilter('all')">
          🎯 <span>My Goals</span>
        </button>

        <button onclick="setFilter('active')">
          ⚡ <span>Active Goals</span>
        </button>

        <button onclick="setFilter('completed')">
          🏆 <span>Completed</span>
        </button>

      </nav>

      <div class="sidebar-bottom">

        <button class="theme-btn" onclick="toggleTheme()">
          🌙 <span>Toggle Theme</span>
        </button>

      </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

      <!-- TOPBAR -->

      <header class="topbar">

        <div class="welcome">

          <h1>Good Day! 👋</h1>

          <p>
            Turn your plans into achievements.
          </p>

        </div>

        <div class="top-actions">

          <div class="date-box" id="currentDate">
            Today
          </div>

          <button
            class="primary-btn"
            onclick="openModal()"
          >
            + New Goal
          </button>

        </div>

      </header>


      <!-- ================= STATS ================= -->

      <section class="stats">

        <div class="stat-card">

          <div class="stat-top">
            <div>
              <h3 id="totalGoals">0</h3>
              <p>Total Goals</p>
            </div>

            <div class="stat-icon">
              🎯
            </div>
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-top">
            <div>
              <h3 id="activeGoals">0</h3>
              <p>Active Goals</p>
            </div>

            <div class="stat-icon">
              ⚡
            </div>
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-top">
            <div>
              <h3 id="completedGoals">0</h3>
              <p>Completed</p>
            </div>

            <div class="stat-icon">
              🏆
            </div>
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-top">
            <div>
              <h3 id="overallProgress">0%</h3>
              <p>Overall Progress</p>
            </div>

            <div class="stat-icon">
              📈
            </div>
          </div>

        </div>

      </section>


      <!-- ================= TOOLBAR ================= -->

      <section class="toolbar">

        <div class="search">

          <span>🔍</span>

          <input
            type="text"
            id="searchInput"
            placeholder="Search your goals..."
            oninput="renderGoals()"
          />

        </div>


        <div class="filters">

          <button
            class="filter-btn active"
            id="filterAll"
            onclick="setFilter('all')"
          >
            All
          </button>

          <button
            class="filter-btn"
            id="filterActive"
            onclick="setFilter('active')"
          >
            Active
          </button>

          <button
            class="filter-btn"
            id="filterCompleted"
            onclick="setFilter('completed')"
          >
            Completed
          </button>

        </div>

      </section>


      <!-- ================= GOALS ================= -->

      <div class="section-title">

        <h2>My Goals</h2>

        <span id="goalCount">
          0 goals
        </span>

      </div>


      <section
        class="goal-grid"
        id="goalGrid"
      ></section>

    </main>

  </div>


  <!-- ================= MODAL ================= -->

  <div
    class="modal-overlay"
    id="modalOverlay"
  >

    <div class="modal">

      <div class="modal-head">

        <h2 id="modalTitle">
          Create New Goal
        </h2>

        <button
          class="close-btn"
          onclick="closeModal()"
        >
          ×
        </button>

      </div>


      <form id="goalForm">

        <div class="form-group">

          <label>
            Goal Title
          </label>

          <input
            type="text"
            id="goalTitle"
            class="form-control"
            placeholder="e.g. Learn Java"
            required
          />

        </div>


        <div class="form-group">

          <label>
            Description
          </label>

          <textarea
            id="goalDescription"
            class="form-control"
            placeholder="Describe your goal..."
          ></textarea>

        </div>


        <div class="form-row">

          <div class="form-group">

            <label>
              Category
            </label>

            <select
              id="goalCategory"
              class="form-control"
            >

              <option value="study">
                📚 Study
              </option>

              <option value="career">
                💼 Career
              </option>

              <option value="fitness">
                🏋️ Fitness
              </option>

              <option value="personal">
                🌱 Personal
              </option>

              <option value="finance">
                💰 Finance
              </option>

              <option value="other">
                🚀 Other
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>
              Deadline
            </label>

            <input
              type="date"
              id="goalDeadline"
              class="form-control"
              required
            />

          </div>

        </div>


        <div class="form-group">

          <label>
            Current Progress
          </label>

          <div class="range-wrapper">

            <input
              type="range"
              id="goalProgress"
              min="0"
              max="100"
              value="0"
              oninput="updateRangeValue()"
            />

            <span
              class="range-value"
              id="rangeValue"
            >
              0%
            </span>

          </div>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            class="cancel-btn"
            onclick="closeModal()"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="primary-btn"
          >
            Save Goal
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- TOAST -->

  <div
    class="toast"
    id="toast"
  >
    Goal saved successfully!
  </div>


  <script>

    /* =========================
       DATA
    ========================= */

    let goals =
      JSON.parse(localStorage.getItem("goalTrackGoals")) || [];

    let currentFilter = "all";

    let editingId = null;


    /* =========================
       CATEGORY ICONS
    ========================= */

    const categoryIcons = {

      study: "📚",

      career: "💼",

      fitness: "🏋️",

      personal: "🌱",

      finance: "💰",

      other: "🚀"

    };


    /* =========================
       INITIAL DATA
    ========================= */

    if (goals.length === 0) {

      goals = [

        {
          id: Date.now(),
          title: "Learn Java",
          description:
            "Complete Core Java and build small projects.",
          category: "study",
          deadline: getDateAfterDays(20),
          progress: 45
        },

        {
          id: Date.now() + 1,
          title: "Build Portfolio",
          description:
            "Create a modern developer portfolio website.",
          category: "career",
          deadline: getDateAfterDays(30),
          progress: 70
        },

        {
          id: Date.now() + 2,
          title: "Daily Exercise",
          description:
            "Maintain a consistent workout routine.",
          category: "fitness",
          deadline: getDateAfterDays(10),
          progress: 25
        }

      ];

      saveGoals();

    }


    /* =========================
       SAVE
    ========================= */

    function saveGoals() {

      localStorage.setItem(
        "goalTrackGoals",
        JSON.stringify(goals)
      );

    }


    /* =========================
       RENDER GOALS
    ========================= */

    function renderGoals() {

      const grid =
        document.getElementById("goalGrid");

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      let filtered = goals.filter(goal => {

        const matchesSearch =
          goal.title
            .toLowerCase()
            .includes(search) ||
          goal.description
            .toLowerCase()
            .includes(search);


        const completed =
          goal.progress >= 100;


        if (currentFilter === "active") {

          return matchesSearch && !completed;

        }

        if (currentFilter === "completed") {

          return matchesSearch && completed;

        }

        return matchesSearch;

      });


      document.getElementById("goalCount").textContent =
        `${filtered.length} goal${filtered.length !== 1 ? "s" : ""}`;


      if (filtered.length === 0) {

        grid.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🎯
            </div>

            <h3>No goals found</h3>

            <p>
              Start by creating your first goal.
            </p>

            <button
              class="primary-btn"
              onclick="openModal()"
            >
              + Create Goal
            </button>

          </div>

        `;

        updateStats();

        return;

      }


      grid.innerHTML =
        filtered.map(goal => {

          const completed =
            goal.progress >= 100;

          const daysLeft =
            calculateDaysLeft(goal.deadline);


          return `

            <article
              class="goal-card ${completed ? "completed" : ""}"
            >

              <div class="goal-head">

                <div class="category-icon">
                  ${categoryIcons[goal.category] || "🎯"}
                </div>

                <div class="goal-menu">

                  <button
                    class="icon-btn"
                    onclick="editGoal(${goal.id})"
                    title="Edit"
                  >
                    ✏️
                  </button>

                  <button
                    class="icon-btn"
                    onclick="deleteGoal(${goal.id})"
                    title="Delete"
                  >
                    🗑️
                  </button>

                </div>

              </div>


              ${
                completed
                  ? `<div class="completed-badge">
                      ✓ Completed
                    </div>`
                  : ""
              }


              <h3>
                ${escapeHTML(goal.title)}
              </h3>


              <p class="description">
                ${escapeHTML(
                  goal.description || "No description added."
                )}
              </p>


              <div class="progress-info">

                <span>
                  Progress
                </span>

                <span>
                  ${goal.progress}%
                </span>

              </div>


              <div class="progress-bar">

                <div
                  class="progress-fill"
                  style="width:${goal.progress}%"
                ></div>

              </div>


              <div class="goal-meta">

                <div class="deadline">

                  Deadline

                  <strong>
                    ${formatDate(goal.deadline)}
                  </strong>

                </div>


                <div class="progress-actions">

                  <button
                    class="small-btn"
                    onclick="changeProgress(${goal.id}, -10)"
                    title="Decrease progress"
                  >
                    −
                  </button>

                  <button
                    class="small-btn"
                    onclick="changeProgress(${goal.id}, 10)"
                    title="Increase progress"
                  >
                    +
                  </button>

                </div>

              </div>

              <div
                style="
                  margin-top:10px;
                  color:${daysLeft < 0 ? "#ef4444" : "var(--muted)"};
                  font-size:12px;
                "
              >

                ${
                  completed
                    ? "🎉 Goal completed!"
                    : daysLeft < 0
                      ? `⚠️ ${Math.abs(daysLeft)} day(s) overdue`
                      : `⏳ ${daysLeft} day(s) remaining`
                }

              </div>

            </article>

          `;

        }).join("");


      updateStats();

    }


    /* =========================
       STATS
    ========================= */

    function updateStats() {

      const total =
        goals.length;

      const completed =
        goals.filter(
          goal => goal.progress >= 100
        ).length;

      const active =
        total - completed;


      let progress = 0;

      if (total > 0) {

        progress =
          Math.round(
            goals.reduce(
              (sum, goal) =>
                sum + Number(goal.progress),
              0
            ) / total
          );

      }


      document.getElementById(
        "totalGoals"
      ).textContent = total;


      document.getElementById(
        "activeGoals"
      ).textContent = active;


      document.getElementById(
        "completedGoals"
      ).textContent = completed;


      document.getElementById(
        "overallProgress"
      ).textContent = `${progress}%`;

    }


    /* =========================
       OPEN MODAL
    ========================= */

    function openModal(id = null) {

      editingId = id;

      const overlay =
        document.getElementById("modalOverlay");

      const title =
        document.getElementById("modalTitle");


      if (id) {

        const goal =
          goals.find(
            item => item.id === id
          );

        if (!goal) return;


        title.textContent =
          "Edit Goal";


        document.getElementById(
          "goalTitle"
        ).value = goal.title;


        document.getElementById(
          "goalDescription"
        ).value = goal.description;


        document.getElementById(
          "goalCategory"
        ).value = goal.category;


        document.getElementById(
          "goalDeadline"
        ).value = goal.deadline;


        document.getElementById(
          "goalProgress"
        ).value = goal.progress;


        document.getElementById(
          "rangeValue"
        ).textContent =
          `${goal.progress}%`;

      } else {

        title.textContent =
          "Create New Goal";


        document.getElementById(
          "goalForm"
        ).reset();


        document.getElementById(
          "goalProgress"
        ).value = 0;


        document.getElementById(
          "rangeValue"
        ).textContent = "0%";


        document.getElementById(
          "goalDeadline"
        ).value =
          getDateAfterDays(7);

      }


      overlay.classList.add("show");

    }


    /* =========================
       CLOSE MODAL
    ========================= */

    function closeModal() {

      document
        .getElementById("modalOverlay")
        .classList.remove("show");

      editingId = null;

    }


    /* =========================
       FORM SUBMIT
    ========================= */

    document
      .getElementById("goalForm")
      .addEventListener(
        "submit",
        function (e) {

          e.preventDefault();


          const title =
            document
              .getElementById("goalTitle")
              .value
              .trim();


          const description =
            document
              .getElementById("goalDescription")
              .value
              .trim();


          const category =
            document
              .getElementById("goalCategory")
              .value;


          const deadline =
            document
              .getElementById("goalDeadline")
              .value;


          const progress =
            Number(
              document
                .getElementById("goalProgress")
                .value
            );


          if (editingId) {

            const goal =
              goals.find(
                item =>
                  item.id === editingId
              );


            if (goal) {

              goal.title = title;

              goal.description =
                description;

              goal.category =
                category;

              goal.deadline =
                deadline;

              goal.progress =
                progress;

            }


            showToast(
              "Goal updated successfully! ✨"
            );

          } else {

            const newGoal = {

              id: Date.now(),

              title,

              description,

              category,

              deadline,

              progress

            };


            goals.unshift(newGoal);


            showToast(
              "New goal created! 🎯"
            );

          }


          saveGoals();

          closeModal();

          renderGoals();

        }
      );


    /* =========================
       EDIT
    ========================= */

    function editGoal(id) {

      openModal(id);

    }


    /* =========================
       DELETE
    ========================= */

    function deleteGoal(id) {

      const goal =
        goals.find(
          item => item.id === id
        );


      if (!goal) return;


      const confirmDelete =
        confirm(
          `Delete "${goal.title}"?`
        );


      if (!confirmDelete) return;


      goals =
        goals.filter(
          item => item.id !== id
        );


      saveGoals();

      renderGoals();

      showToast(
        "Goal deleted."
      );

    }


    /* =========================
       CHANGE PROGRESS
    ========================= */

    function changeProgress(id, amount) {

      const goal =
        goals.find(
          item => item.id === id
        );


      if (!goal) return;


      goal.progress =
        Math.max(
          0,
          Math.min(
            100,
            goal.progress + amount
          )
        );


      saveGoals();

      renderGoals();


      if (goal.progress === 100) {

        showToast(
          "🎉 Goal completed!"
        );

      }

    }


    /* =========================
       FILTER
    ========================= */

    function setFilter(filter) {

      currentFilter = filter;


      document
        .querySelectorAll(".filter-btn")
        .forEach(btn =>
          btn.classList.remove("active")
        );


      if (filter === "all") {

        document
          .getElementById("filterAll")
          .classList.add("active");

      }

      if (filter === "active") {

        document
          .getElementById("filterActive")
          .classList.add("active");

      }

      if (filter === "completed") {

        document
          .getElementById("filterCompleted")
          .classList.add("active");

      }


      renderGoals();

    }


    /* =========================
       RANGE
    ========================= */

    function updateRangeValue() {

      const value =
        document
          .getElementById("goalProgress")
          .value;


      document
        .getElementById("rangeValue")
        .textContent =
        `${value}%`;

    }


    /* =========================
       THEME
    ========================= */

    function toggleTheme() {

      document
        .body
        .classList
        .toggle("dark");


      const isDark =
        document
          .body
          .classList
          .contains("dark");


      localStorage.setItem(
        "goalTrackTheme",
        isDark ? "dark" : "light"
      );

    }


    /* =========================
       LOAD THEME
    ========================= */

    if (
      localStorage.getItem(
        "goalTrackTheme"
      ) === "dark"
    ) {

      document
        .body
        .classList
        .add("dark");

    }


    /* =========================
       DATE
    ========================= */

    function updateDate() {

      const date =
        new Date();


      document.getElementById(
        "currentDate"
      ).textContent =
        date.toLocaleDateString(
          "en-IN",
          {
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric"
          }
        );

    }


    /* =========================
       DAYS LEFT
    ========================= */

    function calculateDaysLeft(dateString) {

      const today =
        new Date();

      today.setHours(
        0, 0, 0, 0
      );


      const deadline =
        new Date(dateString);

      deadline.setHours(
        0, 0, 0, 0
      );


      const difference =
        deadline - today;


      return Math.ceil(
        difference /
        (1000 * 60 * 60 * 24)
      );

    }


    /* =========================
       DATE FORMAT
    ========================= */

    function formatDate(dateString) {

      if (!dateString)
        return "No deadline";


      const date =
        new Date(dateString);


      return date.toLocaleDateString(
        "en-IN",
        {
          day: "numeric",
          month: "short",
          year: "numeric"
        }
      );

    }


    /* =========================
       FUTURE DATE
    ========================= */

    function getDateAfterDays(days) {

      const date =
        new Date();


      date.setDate(
        date.getDate() + days
      );


      const year =
        date.getFullYear();


      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, "0");


      const day =
        String(
          date.getDate()
        ).padStart(2, "0");


      return `${year}-${month}-${day}`;

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(text) {

      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       TOAST
    ========================= */

    function showToast(message) {

      const toast =
        document.getElementById("toast");


      toast.textContent =
        message;


      toast.classList.add("show");


      setTimeout(() => {

        toast.classList.remove(
          "show"
        );

      }, 2500);

    }


    /* =========================
       CLOSE MODAL OUTSIDE
    ========================= */

    document
      .getElementById("modalOverlay")
      .addEventListener(
        "click",
        function (e) {

          if (
            e.target === this
          ) {

            closeModal();

          }

        }
      );


    /* =========================
       KEYBOARD ESCAPE
    ========================= */

    document.addEventListener(
      "keydown",
      function (e) {

        if (e.key === "Escape") {

          closeModal();

        }

      }
    );


    /* =========================
       INITIALIZE
    ========================= */

    updateDate();

    renderGoals();

  </script>

</body>
</html>
